<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkiilsToIAs — Engineering Catalog</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --surface-muted: #f2efe9;
      --text: #18181b;
      --text-muted: #52525b;
      --border: #e4e1da;
      --border-strong: #cfcac0;
      --accent: #18181b;
      --accent-fg: #faf9f6;
      --tag-skill: #2563eb;
      --tag-agent: #7c3aed;
      --tag-mcp: #059669;
      --radius: 10px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg: #0e0e10;
      --surface: #161619;
      --surface-muted: #1f1f24;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: #27272c;
      --border-strong: #3a3a42;
      --accent: #f4f4f5;
      --accent-fg: #0e0e10;
      --tag-skill: #60a5fa;
      --tag-agent: #a78bfa;
      --tag-mcp: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0.4rem 0 0;
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 62ch;
    }

    .theme-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.8rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease;
    }
    .theme-btn:hover { border-color: var(--border-strong); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .search-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 3rem 0.75rem 1rem;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-input:focus { border-color: var(--text); }

    .kbd-hint {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      pointer-events: none;
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .count-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      opacity: 0.8;
    }

    .categories {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: var(--surface-muted);
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cat-btn:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .cat-btn.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--text);
      font-weight: 600;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    .badges {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .badge-skill { color: var(--tag-skill); border-color: color-mix(in srgb, var(--tag-skill) 35%, transparent); }
    .badge-agent { color: var(--tag-agent); border-color: color-mix(in srgb, var(--tag-agent) 35%, transparent); }
    .badge-mcp { color: var(--tag-mcp); border-color: color-mix(in srgb, var(--tag-mcp) 35%, transparent); }

    .card-desc {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
    }

    .card-path {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }

    .copy-btn {
      flex: 1;
      background: var(--surface-muted);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.65rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .copy-btn:hover {
      border-color: var(--border-strong);
      background: var(--surface);
    }
    .copy-btn.copied {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .path-btn {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .path-btn:hover { color: var(--text); border-color: var(--border-strong); }
    .path-btn.copied {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .load-more-wrap {
      display: flex;
      justify-content: center;
      margin-top: 2rem;
    }

    .load-more-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      cursor: pointer;
    }
    .load-more-btn:hover { background: var(--surface-muted); }

    .notice {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .notice h2 { margin-top: 0; font-size: 1.1rem; }
    .notice pre {
      background: var(--surface-muted);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .file-fallback {
      margin-top: 1rem;
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="eyebrow">SkiilsToIAs • Engineering Catalog</div>
        <h1>Skills, Custom Agents &amp; MCP Servers</h1>
        <p class="subtitle">Browse, filter, and copy install commands or repository paths across the full SkiilsToIAs ecosystem.</p>
      </div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle color theme">Theme</button>
    </header>

    <section class="controls" aria-label="Catalog filters">
      <div class="search-row">
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="search" placeholder="Search by name, description, category, or path..." autocomplete="off" />
          <span class="kbd-hint">/</span>
        </div>
        <div class="tabs" role="tablist" aria-label="Type filter">
          <button class="tab-btn active" data-type="all" role="tab" aria-selected="true">All <span class="count-pill" id="count-all">0</span></button>
          <button class="tab-btn" data-type="skill" role="tab" aria-selected="false">Skills <span class="count-pill" id="count-skill">0</span></button>
          <button class="tab-btn" data-type="agent" role="tab" aria-selected="false">Agents <span class="count-pill" id="count-agent">0</span></button>
          <button class="tab-btn" data-type="mcp" role="tab" aria-selected="false">MCPs <span class="count-pill" id="count-mcp">0</span></button>
        </div>
      </div>
      <div id="categoryBar" class="categories" aria-label="Category filter"></div>
    </section>

    <div class="meta-bar">
      <span id="resultsCount">Loading catalog...</span>
      <span id="generatedAt"></span>
    </div>

    <main id="catalogRoot"></main>
    <div id="loadMoreWrap" class="load-more-wrap" hidden>
      <button id="loadMoreBtn" class="load-more-btn" type="button">Show more</button>
    </div>
  </div>

  <script>
    (function () {
      const PAGE_SIZE = 120;
      const state = {
        items: [],
        categories: [],
        type: "all",
        category: "all",
        query: "",
        limit: PAGE_SIZE
      };

      const rootEl = document.getElementById("catalogRoot");
      const searchEl = document.getElementById("searchInput");
      const categoryBar = document.getElementById("categoryBar");
      const resultsCountEl = document.getElementById("resultsCount");
      const generatedAtEl = document.getElementById("generatedAt");
      const loadMoreWrap = document.getElementById("loadMoreWrap");
      const loadMoreBtn = document.getElementById("loadMoreBtn");
      const themeToggle = document.getElementById("themeToggle");

      // Theme initialization
      const savedTheme = localStorage.getItem("catalog-theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const initialTheme = savedTheme || (prefersDark ? "dark" : "light");
      applyTheme(initialTheme);

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.textContent = theme === "dark" ? "☀ Light" : "☾ Dark";
      }

      themeToggle.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem("catalog-theme", next);
        applyTheme(next);
      });

      // Keyboard shortcut '/' to focus search
      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchEl && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          searchEl.focus();
        }
      });

      searchEl.addEventListener("input", () => {
        state.query = searchEl.value.trim().toLowerCase();
        state.limit = PAGE_SIZE;
        render();
      });

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach((b) => {
            b.classList.remove("active");
            b.setAttribute("aria-selected", "false");
          });
          btn.classList.add("active");
          btn.setAttribute("aria-selected", "true");
          state.type = btn.dataset.type;
          state.category = "all";
          state.limit = PAGE_SIZE;
          renderCategories();
          render();
        });
      });

      loadMoreBtn.addEventListener("click", () => {
        state.limit += PAGE_SIZE;
        render();
      });

      async function copyText(text, btn, originalLabel) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          }
          btn.classList.add("copied");
          btn.textContent = "✓ Copied";
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.textContent = originalLabel;
          }, 1400);
        } catch {
          btn.textContent = "Copy failed";
        }
      }

      function renderCategories() {
        const pool = state.type === "all"
          ? state.items
          : state.items.filter((i) => i.type === state.type);

        const counts = new Map();
        for (const item of pool) {
          counts.set(item.category, (counts.get(item.category) || 0) + 1);
        }

        const sorted = Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        categoryBar.innerHTML = "";

        const allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "cat-btn" + (state.category === "all" ? " active" : "");
        allBtn.textContent = `all (${pool.length})`;
        allBtn.addEventListener("click", () => {
          state.category = "all";
          state.limit = PAGE_SIZE;
          renderCategories();
          render();
        });
        categoryBar.appendChild(allBtn);

        for (const [cat, count] of sorted) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cat-btn" + (state.category === cat ? " active" : "");
          btn.textContent = `${cat} (${count})`;
          btn.addEventListener("click", () => {
            state.category = cat;
            state.limit = PAGE_SIZE;
            renderCategories();
            render();
          });
          categoryBar.appendChild(btn);
        }
      }

      function getFiltered() {
        return state.items.filter((item) => {
          if (state.type !== "all" && item.type !== state.type) return false;
          if (state.category !== "all" && item.category !== state.category) return false;
          if (!state.query) return true;
          return (
            item.name.toLowerCase().includes(state.query) ||
            item.description.toLowerCase().includes(state.query) ||
            item.category.toLowerCase().includes(state.query) ||
            item.path.toLowerCase().includes(state.query)
          );
        });
      }

      function render() {
        const filtered = getFiltered();
        resultsCountEl.textContent = `Showing ${Math.min(filtered.length, state.limit)} of ${filtered.length} matching items`;

        if (filtered.length === 0) {
          rootEl.innerHTML = `<div class="empty-state">No catalog items match your current search or filters.</div>`;
          loadMoreWrap.hidden = true;
          return;
        }

        const slice = filtered.slice(0, state.limit);
        const grid = document.createElement("div");
        grid.className = "grid";

        const frag = document.createDocumentFragment();
        for (const item of slice) {
          const card = document.createElement("article");
          card.className = "card";

          const top = document.createElement("div");
          top.className = "card-top";

          const title = document.createElement("h2");
          title.className = "card-title";
          title.textContent = item.name;

          const badges = document.createElement("div");
          badges.className = "badges";
          const typeBadge = document.createElement("span");
          typeBadge.className = `badge badge-${item.type}`;
          typeBadge.textContent = item.type;
          const catBadge = document.createElement("span");
          catBadge.className = "badge";
          catBadge.textContent = item.category;
          badges.append(typeBadge, catBadge);
          top.append(title, badges);

          const desc = document.createElement("p");
          desc.className = "card-desc";
          desc.textContent = item.description || "No description provided.";

          const footer = document.createElement("div");
          footer.className = "card-footer";

          const pathEl = document.createElement("div");
          pathEl.className = "card-path";
          pathEl.title = item.path;
          pathEl.textContent = item.path;

          const actions = document.createElement("div");
          actions.className = "card-actions";

          const copyLabel = item.type === "skill" ? `$ ${item.install_hint}` : `Copy: ${item.install_hint}`;
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "copy-btn";
          copyBtn.title = `Copy: ${item.install_hint}`;
          copyBtn.textContent = copyLabel;
          copyBtn.addEventListener("click", () => copyText(item.install_hint, copyBtn, copyLabel));

          actions.appendChild(copyBtn);

          if (item.install_hint !== item.path) {
            const pathBtn = document.createElement("button");
            pathBtn.type = "button";
            pathBtn.className = "path-btn";
            pathBtn.title = `Copy path: ${item.path}`;
            pathBtn.textContent = "Path";
            pathBtn.addEventListener("click", () => copyText(item.path, pathBtn, "Path"));
            actions.appendChild(pathBtn);
          }

          footer.append(pathEl, actions);
          card.append(top, desc, footer);
          frag.appendChild(card);
        }

        grid.appendChild(frag);
        rootEl.innerHTML = "";
        rootEl.appendChild(grid);

        if (filtered.length > state.limit) {
          loadMoreWrap.hidden = false;
          loadMoreBtn.textContent = `Show more (${filtered.length - state.limit} remaining)`;
        } else {
          loadMoreWrap.hidden = true;
        }
      }

      function hydrate(data) {
        state.items = Array.isArray(data.items) ? data.items : [];
        state.categories = Array.isArray(data.categories) ? data.categories : [];
        const counts = data.counts || {};
        document.getElementById("count-all").textContent = counts.total ?? state.items.length;
        document.getElementById("count-skill").textContent = counts.skills ?? state.items.filter((i) => i.type === "skill").length;
        document.getElementById("count-agent").textContent = counts.agents ?? state.items.filter((i) => i.type === "agent").length;
        document.getElementById("count-mcp").textContent = counts.mcps ?? state.items.filter((i) => i.type === "mcp").length;
        if (data.generated_at) {
          generatedAtEl.textContent = `Updated ${data.generated_at.slice(0, 10)}`;
        }
        renderCategories();
        render();
      }

      function showFallback(errMsg) {
        const isFileProtocol = window.location.protocol === "file:";
        resultsCountEl.textContent = "Catalog not loaded";
        rootEl.innerHTML = `
          <div class="notice">
            <h2>Unable to load <code>./catalog.json</code>${isFileProtocol ? " over <code>file://</code>" : ""}</h2>
            <p>${isFileProtocol
              ? "Browsers block <code>fetch('./catalog.json')</code> on <code>file://</code> URLs due to local CORS restrictions. Serve this folder locally with:"
              : `Error: ${errMsg}`}</p>
            <pre>python -m http.server 8080 -d docs/catalog</pre>
            <p>Then open <code>http://localhost:8080</code> — or select <code>docs/catalog/catalog.json</code> manually below:</p>
            <input id="manualFile" class="file-fallback" type="file" accept=".json,application/json" />
          </div>
        `;
        const fileInput = document.getElementById("manualFile");
        fileInput.addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              hydrate(JSON.parse(String(reader.result)));
            } catch (parseErr) {
              alert("Invalid catalog.json file: " + parseErr.message);
            }
          };
          reader.readAsText(file, "utf-8");
        });
      }

      fetch("./catalog.json")
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(hydrate)
        .catch((err) => showFallback(err.message));
    })();
  </script>
</body>
</html>
