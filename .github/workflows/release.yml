name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Integrity & Secrets
        run: |
          python -c "
          import os
          assert os.path.exists('README.md'), 'README.md must exist'
          assert os.path.exists('CHANGELOG.md'), 'CHANGELOG.md must exist'
          assert os.path.exists('custom-agents'), 'custom-agents folder must exist'
          assert os.path.exists('mcps'), 'mcps folder must exist'
          print('✅ Repositório validado com integridade total!')
          "

      - name: Package Distribution Bundle
        run: |
          mkdir -p dist
          zip -r dist/SkiilsToIAs-bundle-${{ github.ref_name }}.zip custom-agents mcps scripts README.md CHANGELOG.md LICENSE .env.example

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SkiilsToIAs-bundle-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
